[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mandarine"
dynamic = ["version"]
description = "Hold Shift while dragging a file: a radial wheel converts, compresses, crops, redacts, annotates and more."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "anrennnn" }, { name = "Taoufik Jabbari (Astral Shift)" }]
requires-python = ">=3.10"
dependencies = [
  "PySide6-Essentials>=6.7",
  "pymupdf>=1.24.2,<2",
  "pillow>=11.3",
  "pillow-heif>=0.18",
  "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
  "python-xlib>=0.33; sys_platform == 'linux'",
]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Environment :: X11 Applications :: Qt",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.urls]
Homepage = "https://github.com/anrennnn/Mandarine-Linux-Windows"
Source = "https://github.com/anrennnn/Mandarine-Linux-Windows"
Upstream = "https://github.com/jtaoufik/astral-shift"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pytest-cov>=5", "pyinstaller>=6.10"]

[project.scripts]
mandarine = "mandarine.cli:main"

[tool.setuptools.dynamic]
version = { attr = "mandarine.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--cov=mandarine --cov-report=term-missing --cov-fail-under=100"
filterwarnings = ["ignore::DeprecationWarning"]
