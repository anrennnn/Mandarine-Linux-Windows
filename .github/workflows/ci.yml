name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the .deb and the Windows installer as a GitHub release (v<version>)"
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries and helper programs
        timeout-minutes: 30
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /var/lib/man-db/auto-update  # the man-db trigger can stall apt for many minutes
          apt_get() {
            for attempt in 1 2 3; do
              sudo -E timeout 480 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=180 "$@" && return 0
              echo "apt-get $1 failed (attempt $attempt), retrying"; sleep 5
            done
            return 1
          }
          apt_get update
          apt_get install -y --no-install-recommends xvfb xdotool libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libdbus-1-3 libfontconfig1 ffmpeg libreoffice-writer libreoffice-calc \
            tesseract-ocr tesseract-ocr-spa fonts-dejavu-core
      - run: python -m pip install -e ".[dev]"
      - name: Tests (100% coverage enforced by pyproject)
        run: MANDARINE_LIVE_X11=1 xvfb-run -a -s "-screen 0 1280x800x24" python -m pytest -rs

  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Qt runtime libraries (the build smoke-tests the bundled Qt)
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          apt_get() {
            for attempt in 1 2 3; do
              sudo -E timeout 480 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=180 "$@" && return 0
              echo "apt-get $1 failed (attempt $attempt), retrying"; sleep 5
            done
            return 1
          }
          apt_get update
          apt_get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libdbus-1-3 libfontconfig1 libfreetype6 libx11-xcb1 xdg-utils
      - name: Build the .deb
        run: ./scripts/build-deb.sh
      - name: Install it
        timeout-minutes: 8
        run: |
          # The runner's own background updates can hold the dpkg lock: stop them,
          # and install with dpkg (the libraries came in the step above) so no
          # mirror is involved.
          sudo systemctl stop unattended-upgrades.service apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          for attempt in $(seq 1 30); do
            sudo DEBIAN_FRONTEND=noninteractive dpkg -i dist/mandarine_*_amd64.deb && break
            echo "dpkg busy or failed (attempt $attempt), retrying"; sleep 10
          done
          dpkg -s mandarine | grep -q "Status: install ok installed"
      - name: Convert files with the installed app
        timeout-minutes: 5
        run: |
          mandarine --version
          /opt/mandarine/python/bin/python3 -I -c "from PIL import Image; Image.new('RGB', (64, 48), 'orange').save('dot.png')"
          mandarine convert dot.png --to heic
          mandarine convert dot.png --to pdf
          mandarine convert dot.pdf --to jpg
          test -s dot.heic && test -s dot.pdf && test -s dot.jpg
          mandarine targets dot.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.deb

  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Tests (failures are reported as annotations)
        timeout-minutes: 20
        run: |
          set +e
          python -m pytest -p no:cacheprovider --cov-fail-under=0 -q -rfEs \
            tests/test_ops.py tests/test_ops_edges.py tests/test_pages.py tests/test_media_office.py \
            tests/test_cli.py tests/test_windows.py tests/test_wheel_canvas.py tests/test_dialogs.py \
            tests/test_desktop.py > pytest.log 2>&1
          status=$?
          tail -n 40 pytest.log
          if [ $status -ne 0 ]; then
            grep -E "^(FAILED|ERROR)" pytest.log | head -n 40 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::error title=pytest failures::/'
            grep -E "^E  |^tests.*Error|^[a-zA-Z_\\/.:]+:[0-9]+: " pytest.log | head -n 60 | cut -c1-240 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::error title=pytest details::/'
          fi
          exit $status
      - name: Build Mandarine.exe and mandarine-cli.exe
        if: ${{ !cancelled() }}
        run: pyinstaller --noconfirm --log-level WARN --distpath dist --workpath build/pyi packaging/mandarine.spec
      - name: Smoke test the build
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          set -e
          app=dist/Mandarine
          "$app/mandarine-cli.exe" --version
          python -c "from PIL import Image; Image.new('RGB', (64, 48), 'orange').save('dot.png')"
          "$app/mandarine-cli.exe" convert dot.png --to heic
          "$app/mandarine-cli.exe" convert dot.png --to pdf
          "$app/mandarine-cli.exe" convert dot.pdf --to jpg
          test -s dot.heic && test -s dot.pdf && test -s dot.jpg
          # The tray app must start and stay up (Qt plugins, DLLs, hotkey).
          unset QT_QPA_PLATFORM
          "$app/Mandarine.exe" &
          sleep 8
          tasklist //FI "IMAGENAME eq Mandarine.exe" | grep -q Mandarine.exe || { echo "::error title=smoke::Mandarine.exe exited"; exit 1; }
          taskkill //F //IM Mandarine.exe
      - name: Installer (Inno Setup) and portable zip
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $version = (Select-String -Path src/mandarine/__init__.py -Pattern '__version__ = "(.*)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=$version" packaging\windows\mandarine.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Compress-Archive -Path dist\Mandarine -DestinationPath "dist\Mandarine-$version-windows-portable.zip"
          Get-ChildItem dist -File | Format-Table Name, Length
      - name: Install silently and check the right-click entry
        if: ${{ !cancelled() }}
        shell: pwsh
        timeout-minutes: 10
        run: |
          $setup = Get-ChildItem dist\Mandarine-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS="contextmenu,startup"' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\Mandarine\Mandarine.exe"
          if (-not (Test-Path $exe)) { Write-Output "::error title=installer::Mandarine.exe not installed"; exit 1 }
          $key = 'HKCU:\Software\Classes\SystemFileAssociations\.pdf\shell\Mandarine\command'
          if (-not (Test-Path $key)) { Write-Output "::error title=installer::right-click entry missing"; exit 1 }
          (Get-ItemProperty $key).'(default)'
          Stop-Process -Name Mandarine -Force -ErrorAction SilentlyContinue
          & "$env:LOCALAPPDATA\Programs\Mandarine\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES | Out-Null
          Start-Sleep 5
          if (Test-Path $key) { Write-Output "::error title=installer::uninstall left the right-click entry"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Mandarine-Setup-*.exe
            dist/Mandarine-*-windows-portable.zip

  release:
    needs: [deb, windows]  # each installs and smoke-tests its own package; `test` runs alongside
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else
            TAG="v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/mandarine/__init__.py)"; fi
          cd out
          {
            echo "## Linux (Debian 12+, Ubuntu 22.04+, Mint 21+, 64 bits)"
            echo
            echo "\`sudo apt install ./$(ls *.deb)\`"
            echo
            echo "## Windows 10/11 (64 bits)"
            echo
            echo "Ejecuta \`$(ls Mandarine-Setup-*.exe)\`. No pide permisos de administrador. Windows SmartScreen puede avisar porque el instalador no está firmado: «Más información» → «Ejecutar de todas formas»."
            echo
            echo "Versión portable: \`$(ls *-windows-portable.zip)\`."
            echo
            echo "## SHA-256"
            echo
            echo '```'
            sha256sum *
            echo '```'
          } > ../notes.md
          gh release create "$TAG" * --target "$GITHUB_SHA" --title "Mandarine ${TAG#v}" --notes-file ../notes.md \
            || gh release upload "$TAG" * --clobber
