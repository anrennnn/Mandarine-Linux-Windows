name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries and helper programs
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libdbus-1-3 libfontconfig1 ffmpeg libreoffice-writer libreoffice-calc \
            tesseract-ocr tesseract-ocr-spa fonts-dejavu-core
      - run: python -m pip install -e ".[dev]"
      - name: Tests (100% coverage enforced by pyproject)
        run: MANDARINE_LIVE_X11=1 xvfb-run -a -s "-screen 0 1280x800x24" python -m pytest -rs

  deb:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the .deb
        run: ./scripts/build-deb.sh
      - name: Install it and convert a file
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/mandarine_*_amd64.deb
          printf 'Hola\n' > nota.txt
          mandarine --version
          mandarine convert nota.txt --to pdf
          test -s nota.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: mandarine-deb
          path: dist/*.deb
      - name: Publish the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb --title "Mandarine ${GITHUB_REF_NAME#v}" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber
    permissions:
      contents: write
