name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the .deb as a GitHub release (v<version>)"
        type: boolean
        default: true
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries and helper programs
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libdbus-1-3 libfontconfig1 ffmpeg libreoffice-writer libreoffice-calc \
            tesseract-ocr tesseract-ocr-spa fonts-dejavu-core
      - run: python -m pip install -e ".[dev]"
      - name: Tests (100% coverage enforced by pyproject)
        run: MANDARINE_LIVE_X11=1 xvfb-run -a -s "-screen 0 1280x800x24" python -m pytest -rs

  deb:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Qt runtime libraries (the build smoke-tests the bundled Qt)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libdbus-1-3 libfontconfig1
      - name: Build the .deb
        run: bash -x ./scripts/build-deb.sh
      - name: Install it
        timeout-minutes: 15
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./dist/mandarine_*_amd64.deb ffmpeg
      - name: Convert files with the installed app
        timeout-minutes: 5
        run: |
          mandarine --version
          ffmpeg -v error -f lavfi -i testsrc=duration=1:size=160x120:rate=10 clip.mp4
          mandarine convert clip.mp4 --to gif
          test -s clip.gif
          mandarine targets clip.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: mandarine-deb
          path: dist/*.deb
      - name: Publish the release (v* tags, or "Run workflow" with release ticked)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else
            TAG="v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/mandarine/__init__.py)"; fi
          NOTES="Instalar: \`sudo apt install ./$(basename dist/*.deb)\` (Debian 12+, Ubuntu 22.04+, Mint 21+, 64 bits).

          SHA-256: \`$(sha256sum dist/*.deb | cut -d' ' -f1)\`"
          gh release create "$TAG" dist/*.deb --target "$GITHUB_SHA" --title "Mandarine ${TAG#v}" --notes "$NOTES" \
            || gh release upload "$TAG" dist/*.deb --clobber
    permissions:
      contents: write
